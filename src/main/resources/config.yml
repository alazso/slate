config-version: 1
debug: false
language: en
broadcastPrefix: "<gold>[Slate]</gold> "
crateScanRecursive: false
maxBulkOpenAmount: 10
gui:
  click-cooldown-ms: 100
  animation-timeout-seconds: 30
  animation-close-safeguard: complete-on-close # complete-on-close | prevent-close-until-complete
  close-on-damage: true
  menu:
    rows: 4
    border-material: GRAY_STAINED_GLASS_PANE
    crate-slots: "10-16,19-25"

anchors:
  break-confirmation:
    enabled: false
    window-seconds: 5

database:
  type: sqlite
  host: localhost
  port: 5432
  name: slate
  user: slate
  password: ""
  poolSize: 10
  connectionTimeoutMs: 30000

cluster:
  redis:
    enabled: false
    host: localhost
    port: 6379
    password: ""
    database: 0
    lockTtlMs: 5000
    acquireTimeoutMs: 5000

currency:
  # auto = Ledger first, then Vault, then NoOp.
  default-provider: auto
  # Used when callers do not specify a currency.
  default-currency: coins
  ledger:
    enabled: true
  vault:
    enabled: true
    # Vault is single-currency only; Slate maps this alias to Vault balances.
    currency-id: money
    currency-name: "Money"
    currency-symbol: "$"
    decimals: 2
  format:
    # us, uk, eu, jp, in, ch, custom
    standard: us
    # prefix or suffix
    symbol-placement: prefix
    use-grouping: true
    min-fraction-digits: 2
    max-fraction-digits: 2
    default-symbol: "$"
    custom:
      # Used only when standard=custom
      pattern: "#,##0.00"
      decimal-separator: "."
      grouping-separator: ","
