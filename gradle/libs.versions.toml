[versions]
kotlin = "2.3.0"
paperweight = "2.0.0-SNAPSHOT"
runpaper = "2.3.1"
shadow = "9.3.0"
pluginyml = "0.6.0"
paper = "26.1.2.build.64-stable"
coroutines = "1.10.1"
exposed = "0.61.0"
hikari = "6.3.0"
sqlite = "3.50.1.0"
postgres = "42.7.4"
bstats = "3.1.0"
jedis = "5.2.0"
junit = "5.11.4"
mockk = "1.14.9"
mockbukkit = "4.34.0"

[libraries]
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugin-yml-paper = { id = "net.minecrell.plugin-yml.paper", version.ref = "pluginyml" }
